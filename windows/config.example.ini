; Settings for visual_radio.py
;
; Copy this file to config.ini (same folder) and fill in what you need.
; config.ini is in .gitignore, so your keys stay on this PC.
; Order: the command line wins, then environment variables, then this file.
; Lines starting with ; are comments.

[keys]
; AcoustID application key (free, https://acoustid.org/new-application)
; Recognises songs from their sound.
acoustid_key =

; Hugging Face token (type "Read", https://huggingface.co/settings/tokens)
; Only needed once, for the first download of the speaker model (--speakers).
hf_token =

[options]
; Defaults for any command-line option: the name without "--", "-" may be "_".
; yes/no for on/off switches. Remove the ; to use a line.
;web = yes
;no_audio = yes          ; no sound from the PC speakers (listen in the browser)
;no_load = yes           ; no CPU / GPU meters on the page
;save_transcript = no    ; don't write the transcript to fm_transcripts.txt
;transcript = fm_transcripts.txt   ; or another file
;web_port = 8080
;web_control = yes
;delay = 45
;language = nl          ; write all talk in Dutch (other languages get translated, roughly); auto: as spoken
;model = large-v3
;content = both
;speakers = yes
;speaker_threshold = 0.45
;isolate = all          ; take the music out before Whisper: off, talk, songs, all (pip install demucs)
;style_from = rds
;song_source = both
;song_interval = 15
;no_song_language = yes  ; keep --language for lyrics too (no MusicBrainz language lookup)
;gain = 18
;volume = 1.0
;band = dab             ; start on DAB+ (fm / dab; default: the band you listened to last)
;dab_station = NPO Radio 1
;dab_gain = -1          ; Airspy gain step for DAB+, 0-21, -1 = automatic

; [state] is added by the script itself (the last station you listened to)
